[project]
name = "npc-ui-inspection"
version = "0.0.0"
description = "Dedicated environment for the NPC rAIdiologist inference UIs"
requires-python = ">=3.9,<3.10"
# Pins mirror the working dev_torch2 env (Pascal Titan Xp: torch 2.1.1 + cu118 only).
dependencies = [
    "torch==2.1.1+cu118",
    "torchvision==0.16.1+cu118",
    "torchaudio==2.1.1+cu118",
    "triton==2.1.0",
    "numpy==1.26.3",
    "setuptools==75.8.0",
    # UI. gradio 5 needs Python>=3.10, so use the newest 4.x for py3.9; hub/pydantic pinned to what 4.44 supports.
    "gradio>=4.44,<5",
    "huggingface_hub==0.36.2",
    "pydantic==2.10.5",
    "streamlit",
    # Versions below follow the dev_torch2 pip list.
    "SimpleITK==2.2.1",
    "opencv-python==4.6.0.66",
    "einops==0.8.2",
    "matplotlib==3.9.1",
    "rich==13.9.4",
    "pandas==2.2.3",
    "transformers==4.36.0",
    "tokenizers==0.15.2",
    "safetensors==0.5.2",
    "scikit-learn==1.6.1",
    "scikit-image==0.19.3",
    "scipy==1.13.1",
    "nibabel==5.0.1",
    "pydicom==2.4.4",
    "click==8.1.3",
    "PyYAML==6.0.2",
    "tqdm==4.65.0",
    "wandb==0.26.1",
    "netgraph==4.13.2",
    "decorator==5.1.1",
    "cachetools==5.3.0",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
    "tabulate==0.9.0",
    "imageio==2.36.1",
    "sympy==1.13.3",
    "pillow==9.2.0",
    "requests==2.31.0",
    "typing_extensions==4.12.2",
    # Editable sources, same checkouts as dev_torch2.
    "tensorboardX==2.6.2.2",
    "protobuf==4.21.12",
    "torchio",
    "mri-normalization-tools",
    "pytorch-medical-imaging",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torchio = { path = "/media/storage/Source/Repos/NPC_Segmentation/ThirdParty/torchio", editable = true }
mri-normalization-tools = { path = "/media/storage/Source/Repos/mri_normalization_tools", editable = true }
pytorch-medical-imaging = { path = "/media/storage/Source/Repos/NPC_Segmentation", editable = true }

[tool.uv.extra-build-dependencies]
# pytorch-medical-imaging builds its Cython extensions in setup.py
pytorch-medical-imaging = ["cython==3.0.12", "numpy==1.26.3", "setuptools==75.8.0"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
